name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: install.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n + shellcheck
        run: |
          bash -n install.sh
          shellcheck install.sh

  powershell:
    name: install.ps1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

  ruby:
    name: Formula syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ruby -c on formulas and strategy
        run: |
          for f in Formula/*.rb lib/*.rb; do ruby -c "$f"; done
