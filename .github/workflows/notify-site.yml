name: Notify leviath.dev

# leviath.dev prints the version a reader is about to install, and it reads that
# number from `Formula/leviath.rb` in this repository — the same file `brew` reads.
# That is deliberate: every install route the site offers ends here, since its
# `curl | sh` snippet is a shim that forwards to the install.sh below. Taking the
# number from the runtime's release tag instead is what let the page advertise
# 0.3.7 while `brew upgrade` was still a no-op on 0.2.0.
#
# So this repository, not the runtime, owns the event that changes the site. A
# promotion upstream does not: until a bump lands here, what a reader installs has
# not moved, and the page saying the older number is correct rather than stale.
#
# Fires on the merge, whichever way it happened — auto-merge, a direct merge once
# the checks were green, or a human merging by hand.
#
# Needs TAP_PR_TOKEN to have GEMISIS/leviath.dev in its repository access, with
# `Actions: read and write` alongside the pull-request permission it already has.
# See the note on the step below for why it is Actions and not Contents.

on:
  push:
    branches: [main]
    paths:
      # The three files that decide what a reader ends up with. Everything else
      # here — README, lint config, the download strategy — leaves the site's
      # answer unchanged, and a deploy per unrelated commit is the waste the cron
      # was already criticised for.
      - 'Formula/**'
      - 'install.sh'
      - 'install.ps1'
  workflow_dispatch:

# Read-only, and only to look up the version for the log line. The dispatch itself
# reaches another repository, which no GITHUB_TOKEN permission can grant.
permissions:
  contents: read

jobs:
  notify:
    name: Refresh leviath.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Formula
          sparse-checkout-cone-mode: false

      # `workflow run`, not a repository dispatch, and the reason is which
      # permission each one costs. A fine-grained PAT carries ONE permission set
      # across every repository you select for it - there is no per-repository
      # matrix - so whatever this needs on leviath.dev, TAP_PR_TOKEN also gains
      # here.
      #
      #   repository_dispatch   Contents: write   would let this token push code
      #                                           to this repository, and the
      #                                           header of bump-manifests.yml
      #                                           promises in as many words that
      #                                           it cannot.
      #   workflow_dispatch     Actions: write    lets it start a workflow. It
      #                                           still cannot push a commit,
      #                                           read a secret, or bypass the
      #                                           ruleset.
      #
      # Same deploy either way; the site rebuilds from source and reads the
      # version out of the formula, so nothing needs to travel in a payload.
      - name: Ask leviath.dev to redeploy
        env:
          # A PAT, because GITHUB_TOKEN is scoped to this repository and cannot
          # reach another one.
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' Formula/leviath.rb | head -1)
          echo "stable formula now declares ${version:-unknown}"

          if [ -z "${GH_TOKEN:-}" ]; then
            # Not a failure. The site keeps a daily refresh, so a missing secret
            # costs freshness rather than correctness, and a red X here would say
            # something untrue about a bump that landed perfectly well.
            echo "::warning::TAP_PR_TOKEN is not set, so leviath.dev will not refresh until its daily run."
            exit 0
          fi

          if ! err=$(gh workflow run deploy.yml --repo GEMISIS/leviath.dev 2>&1); then
            # Named separately from "not set", because this is the failure that
            # actually happens: the token exists but has not been given
            # leviath.dev, or has it without Actions: write.
            echo "::warning::Could not start the leviath.dev deploy, so it will not refresh until its daily run. Give TAP_PR_TOKEN access to GEMISIS/leviath.dev with 'Actions: read and write'. GitHub said: ${err}"
            exit 0
          fi

          echo "Asked leviath.dev to redeploy for $version." >> "$GITHUB_STEP_SUMMARY"
