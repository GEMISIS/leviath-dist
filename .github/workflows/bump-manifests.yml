name: Bump manifests

# Keeps the tap's declared versions in step with what the release pipeline just
# published. This is not cosmetic: Homebrew and Scoop decide "is an upgrade
# available" by comparing the installed version against the version *declared*
# in the manifest — neither ever looks at what is behind the download URL. The
# URLs here are rolling channel tags, so a stale `version` string means
# `brew upgrade` is a no-op forever and existing users stay pinned to whatever
# they first installed, even though the tag has moved on.
#
# Fired by leviath's alpha/beta/prod workflows once a release is published:
#
#   gh api repos/GEMISIS/leviath-dist/dispatches \
#     -f event_type=release-published \
#     -F client_payload[channel]=stable \
#     -F client_payload[version]=0.1.1
#
# The caller sends the exact string to write rather than having this workflow
# derive it, so each channel keeps ownership of its own versioning scheme
# (alpha, for instance, needs a per-build suffix to stay monotonic).
#
# It opens a PR rather than pushing: the "Main Branch Protections" ruleset
# requires changes to arrive by pull request, with its checks passing and with
# verified signatures. Commits are therefore written through the Contents API,
# which GitHub signs, and one long-lived branch per channel is reused so a
# nightly alpha updates its existing PR instead of opening a new one every day.
#
# ── Why two credentials ──────────────────────────────────────────────────────
#
# The commit and the pull request are made by different identities, and the
# split is the whole reason this lands unattended.
#
#   commit  →  github.token       its Contents API commits are *signed*, which
#                                 `required_signatures` insists on. A token of
#                                 any other kind produces unsigned commits that
#                                 the ruleset then refuses.
#   the PR  →  secrets.TAP_PR_TOKEN
#                                 a pull request opened by GITHUB_TOKEN does not
#                                 start the `Lint` workflow it needs to pass:
#                                 the run arrives `action_required` and waits for
#                                 a person. The required checks therefore never
#                                 report and auto-merge never fires, so the tap
#                                 sat a version behind until somebody noticed.
#                                 A PR opened by a real identity fires the event
#                                 normally and Lint runs on its own.
#   auto-merge  →  github.token   and this is the part that was wrong. Arming
#                                 auto-merge is `enablePullRequestAutoMerge`,
#                                 which GitHub gates on *write access to the
#                                 repository's contents* - it is a promise to
#                                 push a merge commit later, not a pull-request
#                                 edit. TAP_PR_TOKEN has pull requests and
#                                 nothing else, exactly as documented below, so
#                                 it opened every PR and could never arm one.
#
# TAP_PR_TOKEN is a fine-grained PAT scoped to this repository with
# `Pull requests: read and write` and nothing else. It cannot push code and it
# cannot bypass a rule - the merge is still gated on the three Lint checks and
# on the commits being signed. It only makes the event fire.
#
# A ruleset bypass was the other option and is worse: a bypass skips the *whole*
# ruleset, `required_signatures` included, so the bump commits would land on
# main unsigned. (It is also unavailable here - GitHub refuses an Actions
# integration bypass on a user-owned repository: "Actor GitHub Actions
# integration must be part of the ruleset source or owner organization".)
#
# Repo setting worth having: with "Allow auto-merge" enabled, the final step
# lands each bump automatically once Lint passes. Without it the PR simply
# waits for a human, and the tap stays correct either way — just not unattended.

on:
  repository_dispatch:
    types: [release-published]
  # Manual escape hatch: re-sync a channel by hand without cutting a release.
  workflow_dispatch:
    inputs:
      channel:
        description: Channel whose manifests should be updated
        required: true
        type: choice
        options: [stable, beta, alpha]
      version:
        description: Exact version string to write (e.g. 0.1.1, 0.1.1-beta)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # To start notify-site.yml once the bump has actually landed. The push that
  # lands it cannot do that itself: GitHub performs a GITHUB_TOKEN auto-merge as
  # GITHUB_TOKEN, and a push from GITHUB_TOKEN creates no workflow run.
  actions: write

concurrency:
  # Serialize per channel: two releases landing together must not race on the
  # same branch, but stable must not have to wait behind alpha either.
  group: bump-${{ github.event.client_payload.channel || inputs.channel }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump ${{ github.event.client_payload.channel || inputs.channel }} manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve channel and version
        id: resolve
        env:
          CHANNEL: ${{ github.event.client_payload.channel || inputs.channel }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail

          case "$CHANNEL" in
            stable) formula=Formula/leviath.rb;       manifest=bucket/leviath.json ;;
            beta)   formula=Formula/leviath-beta.rb;  manifest=bucket/leviath-beta.json ;;
            alpha)  formula=Formula/leviath-alpha.rb; manifest=bucket/leviath-alpha.json ;;
            *)
              echo "::error::unknown channel '$CHANNEL' (expected stable, beta, or alpha)"
              exit 1
              ;;
          esac

          # Anything that lands in a formula gets executed by Homebrew as Ruby
          # and by Scoop as JSON, so refuse a payload that is not a plain
          # version string before it reaches the file.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a valid version string"
            exit 1
          fi

          for f in "$formula" "$manifest"; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f to exist"
              exit 1
            fi
          done

          {
            echo "channel=$CHANNEL"
            echo "formula=$formula"
            echo "manifest=$manifest"
            echo "version=$VERSION"
            echo "branch=tap-bump/$CHANNEL"
          } >> "$GITHUB_OUTPUT"

      - name: Write the version
        id: write
        env:
          FORMULA: ${{ steps.resolve.outputs.formula }}
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          python3 - "$FORMULA" "$MANIFEST" "$VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          formula_path, manifest_path, version = sys.argv[1], sys.argv[2], sys.argv[3]

          formula = pathlib.Path(formula_path)
          text = formula.read_text()
          updated, count = re.subn(
              r'^(\s*version\s+)"[^"]*"',
              lambda m: f'{m.group(1)}"{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              sys.exit(f"{formula_path}: expected exactly one version line, found {count}")
          formula.write_text(updated)

          manifest = pathlib.Path(manifest_path)
          data = json.loads(manifest.read_text())
          if "version" not in data:
              sys.exit(f"{manifest_path}: no version field")
          data["version"] = version
          # Scoop manifests are hand-edited too; keep the existing formatting.
          manifest.write_text(json.dumps(data, indent=4) + "\n")
          PY

          if git diff --quiet; then
            echo "Already at $VERSION — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the files still parse
        if: steps.write.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for f in Formula/*.rb lib/*.rb; do ruby -c "$f"; done
          for f in bucket/*.json; do python3 -m json.tool "$f" > /dev/null; done

      # Written through the Contents API rather than `git push`: main requires
      # verified signatures, and GitHub signs commits it creates itself.
      - name: Commit to the channel branch
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          FORMULA: ${{ steps.resolve.outputs.formula }}
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
          VERSION: ${{ steps.resolve.outputs.version }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
        run: |
          set -euo pipefail

          base_sha=$(gh api "repos/$REPO/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)

          # Reset the channel branch onto main. Any unmerged bump sitting there
          # is for an older release of this same channel, so it is superseded
          # rather than something to preserve.
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$BRANCH" -f sha="$base_sha" >/dev/null
          fi

          for path in "$FORMULA" "$MANIFEST"; do
            current=$(gh api "repos/$REPO/contents/$path?ref=$BRANCH" --jq .sha)
            gh api -X PUT "repos/$REPO/contents/$path" \
              -f message="chore: bump $CHANNEL $(basename "$path") to $VERSION" \
              -f content="$(base64 -w0 < "$path")" \
              -f sha="$current" \
              -f branch="$BRANCH" >/dev/null
            echo "committed $path"
          done

      # `TAP_PR_TOKEN`, not `github.token`: see the note at the top. A PR opened
      # by GITHUB_TOKEN does not start the Lint run it has to pass, so it waits
      # for a person forever. Falling back to `github.token` when the secret is
      # absent keeps the tap correct on a repo that has not set it up - the PR
      # is still opened and still carries the right manifests, it just needs a
      # human to approve its checks, which is where this started.
      - name: Open or update the pull request
        id: pr
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN || github.token }}
          HAVE_PR_TOKEN: ${{ secrets.TAP_PR_TOKEN != '' }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          VERSION: ${{ steps.resolve.outputs.version }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
        run: |
          set -euo pipefail

          if [ "$HAVE_PR_TOKEN" != "true" ]; then
            echo "::warning::TAP_PR_TOKEN is not set, so this PR is opened by GITHUB_TOKEN and its Lint run will wait for manual approval before it can merge. Add a fine-grained PAT with 'Pull requests: read and write' as TAP_PR_TOKEN to land these unattended."
          fi

          title="chore: bump $CHANNEL manifests to $VERSION"
          body="Automated: the $CHANNEL channel published \`$VERSION\`.

          Homebrew and Scoop compare the installed version against the version
          declared here to decide whether an upgrade exists — they never look at
          what is behind the rolling channel tag these manifests point at. Until
          this lands, \`brew upgrade\` stays a no-op for $CHANNEL users."

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            url=$(gh pr view "$existing" --json url --jq .url)
            echo "Updated existing PR: $url"
          else
            if ! url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "$title" --body "$body" 2>&1); then
              # The commits are already on the branch and verified; only the PR
              # is missing, so say exactly what unblocks it rather than leaving
              # a GraphQL string behind.
              if printf '%s' "$url" | grep -q 'not permitted to create'; then
                echo "::error::Commits are on $BRANCH but the PR could not be opened. With TAP_PR_TOKEN set, check it has 'Pull requests: read and write' on this repository and has not expired; without it, enable Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests'. Either way the manifests are safe on $BRANCH - open a PR from it by hand to land them now."
              else
                echo "::error::could not open a PR from $BRANCH: $url"
              fi
              exit 1
            fi
            echo "Opened PR: $url"
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # Separate step for one reason: a different token. Arming auto-merge needs
      # contents write (see the header), which is what `github.token` has here
      # and what TAP_PR_TOKEN deliberately does not. Opening the PR needs a real
      # identity; arming it does not care who opened it.
      #
      # Two things land it once the three Lint checks report green: auto-merge
      # if the PR is still waiting on them, and a plain merge if they already
      # finished — GitHub refuses to *arm* auto-merge on a pull request that has
      # nothing left to wait for, and these three checks are fast enough to beat
      # this step. Neither path can merge a red PR: the ruleset is what enforces
      # that, and this token cannot bypass it.
      - name: Land it
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -uo pipefail

          merged=false
          if auto=$(gh pr merge "$URL" --auto --squash 2>&1); then
            echo "Auto-merge armed; $URL lands when Lint reports green."
            # And then wait for it, which is not impatience. GitHub performs an
            # auto-merge armed by GITHUB_TOKEN as GITHUB_TOKEN, and a push from
            # GITHUB_TOKEN creates no workflow run at all - so notify-site.yml's
            # `push` trigger never sees these land. Three bumps proved it: the
            # one PR a human merged that day fired Lint on push, and the three
            # the bot merged fired nothing.
            #
            # Lint is three syntax jobs, so this normally resolves in well under
            # a minute. The cap is generous because the cost of overrunning it
            # is only a slower website.
            for _ in $(seq 1 30); do
              sleep 10
              if [ "$(gh pr view "$URL" --json state --jq .state)" = "MERGED" ]; then
                merged=true
                break
              fi
            done
          elif now=$(gh pr merge "$URL" --squash 2>&1); then
            echo "Checks had already passed, so $URL was merged directly."
            merged=true
          else
            # Both failed, so say what each one actually said rather than
            # guessing at a cause. An earlier version of this step discarded
            # these two messages and asserted the repo had auto-merge switched
            # off, which was never true and sent the search in the wrong
            # direction for weeks.
            echo "::error::$URL could not be landed and needs a manual merge. Arming auto-merge said: ${auto}. Merging now said: ${now}."
            # Red, because the manifests not reaching main is this job not having
            # done its job. The bump is safe on its branch either way, and a green
            # run with an open PR behind it is how the last one went unnoticed.
            exit 1
          fi

          if [ "$merged" != true ]; then
            echo "::warning::$URL had not merged after five minutes. Auto-merge is still armed and will land it, but leviath.dev will not hear about it until its daily refresh."
            exit 0
          fi

          # Hand off to notify-site.yml rather than dispatching the site from
          # here, so the token and the URL for that live in one file. This is
          # allowed where the push above was not: workflow_dispatch and
          # repository_dispatch are the two documented exceptions to
          # GITHUB_TOKEN-triggered events creating no runs.
          if ! err=$(gh workflow run notify-site.yml 2>&1); then
            echo "::warning::Landed $URL but could not ask leviath.dev to refresh, so it will wait for its daily run. GitHub said: ${err}"
          fi
